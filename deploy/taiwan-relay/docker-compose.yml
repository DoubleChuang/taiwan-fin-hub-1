services:
  # 1. 無頭 Chrome 服務 (處理第一銀行、華南銀行等網銀爬蟲)
  chrome:
    image: browserless/chrome:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9222:3000"
    environment:
      - TOKEN=${RELAY_SECRET_TOKEN}
      - CONCURRENT=2
      - KEEP_ALIVE=true
      - QUEUE_LENGTH=5
      - MAX_CONCURRENT_SESSIONS=2
      - PREBOOT_CHROME=true

  # 2. 泛用 HTTP Relay (處理中信、新光、王道、發票等 API 轉發)
  http-relay:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      - PORT=8788
      - HOST=0.0.0.0
      - RELAY_TOKEN=${RELAY_SECRET_TOKEN}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://eb.ctbcbank.com,https://*.skbank.com.tw,https://*.obank.com.tw,https://api.einvoice.nat.gov.tw,https://*.tdcc.com.tw,https://*.esunbank.com.tw,https://*.firstbank.com.tw,https://*.hncb.com.tw,https://*.cathaybk.com.tw,https://*.taishinbank.com.tw,https://*.kgibank.com.tw}

  # 3. Cloudflare Tunnel (將台灣主機服務以安全通道暴露至 Cloudflare，免對外開 Port)
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
