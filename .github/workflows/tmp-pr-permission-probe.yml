name: tmp pr permission probe

on:
  push:
    branches: [tmp-pr-permission-probe]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync upstream main safely (copy)
        id: sync
        env:
          SYNC_CREATE_PR: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "taiwan-fin-hub-updater"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/sync-upstream.mjs
