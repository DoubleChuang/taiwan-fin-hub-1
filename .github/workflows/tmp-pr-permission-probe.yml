name: tmp pr permission probe

on:
  push:
    branches: [tmp-pr-permission-probe]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Try creating a sync-style PR with GITHUB_TOKEN only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "probe"
          git config user.email "probe@example.com"
          git switch -c sync/probe-exact-2
          git commit --allow-empty -m "probe: exact sync style"
          git push origin HEAD:refs/heads/sync/probe-exact-2
          gh --version
          gh pr create --base main --head sync/probe-exact-2 --title "probe: exact sync style" --body "probe body with 中文" --draft
