name: tmp pr permission probe

on:
  push:
    branches: [tmp-pr-permission-probe]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: non-draft shell PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "probe"
          git config user.email "probe@example.com"
          git switch -c sync/probe-nondraft
          git commit --allow-empty -m "probe non-draft"
          git push origin HEAD:refs/heads/sync/probe-nondraft
          gh pr create --base main --head sync/probe-nondraft --title "probe non-draft shell" --body "probe body with 中文" || echo "SHELL_NONDRAFT_FAILED"
      - name: non-draft node spawn PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git switch -c sync/probe-nondraft-node
          git commit --allow-empty -m "probe non-draft node"
          git push origin HEAD:refs/heads/sync/probe-nondraft-node
          node -e '
            const { spawnSync } = require("child_process");
            const args = ["pr","create","--base","main","--head","sync/probe-nondraft-node","--title","probe non-draft node","--body","line1\nline2"];
            const r = spawnSync("gh", args, { encoding: "utf8" });
            console.log("NODE EXIT", r.status);
            console.log(r.stdout || "");
            console.error(r.stderr || "");
          '
