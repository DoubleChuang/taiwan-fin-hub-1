name: tmp pr permission probe

on:
  push:
    branches: [tmp-pr-permission-probe]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR create with an extra upstream remote
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "probe"
          git config user.email "probe@example.com"
          git remote add upstream https://github.com/TedLin1993/all-set-tw.git
          git remote -v
          echo "--- with upstream remote present ---"
          git switch -c sync/probe-with-upstream
          git commit --allow-empty -m "probe with upstream remote"
          git push origin HEAD:refs/heads/sync/probe-with-upstream
          gh pr create --base main --head sync/probe-with-upstream --title "probe with upstream remote" --body "probe" || echo "WITH_UPSTREAM_FAILED"
          echo "--- with explicit --repo ---"
          gh pr create --repo DoubleChuang/taiwan-fin-hub-1 --base main --head sync/probe-with-upstream --title "probe with repo flag" --body "probe" || echo "WITH_REPO_FLAG_FAILED"
