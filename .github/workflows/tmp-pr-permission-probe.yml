name: tmp pr permission probe

on:
  push:
    branches: [tmp-pr-permission-probe]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose shell gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "shell token length: ${#GITHUB_TOKEN}"
          gh auth status || true
      - name: Diagnose node-spawned gh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e 'const {spawnSync}=require("child_process"); console.log("node token length:", (process.env.GITHUB_TOKEN||"").length); const r=spawnSync("gh",["auth","status"],{encoding:"utf8"}); process.stdout.write(r.stdout||""); process.stderr.write(r.stderr||""); console.log("exit", r.status);'
